<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>O-P Labs | Zen Protocol Clock</title>
  <style>
    :root {
      --bg: #030406;
      --text: #ffffff;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.4);
      --panel-bg: rgba(15, 20, 28, 0.75);
      --panel-border: rgba(255, 255, 255, 0.1);
      --muted: #8b949e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      transition: background-color 0.8s ease;
    }

    /* Main Clock Display */
    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.7;
      transition: color 0.5s ease, opacity 0.5s ease;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 0 8px var(--text);
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }
    .status-badge.resting { color: var(--emerald); opacity: 1; }
    .status-badge.resting .pulse-dot {
      background: var(--emerald);
      box-shadow: 0 0 12px var(--emerald);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    #clock {
      font-size: 16vw;
      font-weight: 800;
      letter-spacing: -3px;
      font-variant-numeric: tabular-nums;
      transition: color 0.8s ease, text-shadow 0.8s ease, transform 0.3s ease;
    }

    .is-resting #clock {
      color: var(--emerald);
      text-shadow: 0 0 40px var(--emerald-glow);
    }

    /* Settings Trigger */
    .settings-trigger {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      opacity: 0;
      cursor: pointer;
      z-index: 50;
      transition: opacity 0.3s ease;
      color: var(--muted);
    }
    body:hover .settings-trigger, .settings-trigger:active { opacity: 0.6; }
    .settings-trigger:hover { opacity: 1; }

    /* Settings Panel */
    .settings-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .settings-overlay.active { opacity: 1; pointer-events: auto; }
    .settings-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 28px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      transform: translateY(20px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .settings-overlay.active .settings-panel { transform: translateY(0); }
    .panel-header {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn { font-size: 20px; cursor: pointer; color: var(--muted); }
    
    .tabs {
      display: flex;
      background: rgba(0,0,0,0.5);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 0;
      cursor: pointer;
      border-radius: 7px;
      color: var(--muted);
      transition: 0.2s;
    }
    .tab.active { background: #232a38; color: var(--text); }

    .form-group { display: none; flex-direction: column; gap: 14px; }
    .form-group.active { display: flex; }
    
    .input-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
    .input-col { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    
    input[type="number"], input[type="time"], input[type="text"] {
      background: #11151c;
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    input[type="number"], input[type="time"] { width: 100px; }
    input[type="text"] { width: 100%; font-size: 12px; color: #a1a1aa; }
    input:focus { border-color: var(--emerald); }

    .action-btn {
      margin-top: 10px;
      width: 100%;
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .action-btn:hover { background: #e5e7eb; }
    .action-btn.emerald { background: var(--emerald); color: #000; }
    .action-btn.emerald:hover { background: #34d399; }

    /* Universal Music Drawer */
    .music-drawer {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(calc(100% - 14px));
      width: 90%;
      max-width: 480px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-bottom: none;
      border-radius: 16px 16px 0 0;
      padding: 10px;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    }
    .music-drawer:hover, .music-drawer.active {
      transform: translateX(-50%) translateY(0);
    }
    .music-indicator {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .music-drawer:hover .music-indicator { background: rgba(255, 255, 255, 0.4); }

    .music-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 10px;
    }
    .m-tab {
      flex: 1;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      padding: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
      border: 1px solid transparent;
      transition: 0.2s;
    }
    .m-tab.active {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border-color: rgba(255,255,255,0.3);
    }

    .music-frame {
      width: 100%;
      height: 152px;
      border-radius: 10px;
      display: none;
      background: #0a0d14;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .music-frame.active { display: block; }
    #frame-youtube { height: 180px; }
    
    .hint-text { font-size: 10px; color: #6b7280; margin-top: -4px; line-height: 1.4; }

    @media (max-width: 600px) {
      #clock { font-size: 22vw; }
      .settings-trigger { opacity: 0.3; }
      .music-drawer { width: 95%; }
    }
  </style>
</head>
<body>

  <!-- Settings Trigger -->
  <div class="settings-trigger" id="btnOpenSettings">⚙️</div>

  <!-- Main Clock Display -->
  <div class="clock-container" id="mainContainer">
    <div class="status-badge" id="statusBadge">
      <span class="pulse-dot"></span>
      <span id="statusText">FOCUS PROTOCOL</span>
    </div>
    <div id="clock">00:00:00</div>
  </div>

  <!-- Music Drawer -->
  <div class="music-drawer" id="musicDrawer">
    <div class="music-indicator"></div>
    <div class="music-tabs">
      <div class="m-tab active" data-target="frame-apple" onclick="switchMusic(this)">Apple Music</div>
      <div class="m-tab" data-target="frame-spotify" onclick="switchMusic(this)">Spotify</div>
      <div class="m-tab" data-target="frame-youtube" onclick="switchMusic(this)">YouTube</div>
    </div>
    <iframe id="frame-apple" class="music-frame active" allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write" src=""></iframe>
    <iframe id="frame-spotify" class="music-frame" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" src=""></iframe>
    <iframe id="frame-youtube" class="music-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" src=""></iframe>
  </div>

  <!-- Settings Panel -->
  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
      <div class="panel-header">
        <span>Settings & Music</span>
        <span class="close-btn" id="btnCloseSettings">&times;</span>
      </div>
      
      <div class="tabs">
        <div class="tab active" id="tabInterval" onclick="switchTab('interval')">Interval</div>
        <div class="tab" id="tabSchedule" onclick="switchTab('schedule')">Schedule</div>
        <div class="tab" id="tabMusic" onclick="switchTab('music')">Music (自訂歌單)</div>
      </div>

      <!-- Interval Mode -->
      <div class="form-group active" id="formInterval">
        <div class="input-row">
          <span>Focus Time (mins)</span>
          <input type="number" id="inpFocus" min="1">
        </div>
        <div class="input-row">
          <span>Rest Time (mins)</span>
          <input type="number" id="inpRest" min="1">
        </div>
        <button class="action-btn emerald" onclick="startInterval()">Start New Cycle</button>
      </div>

      <!-- Schedule Mode -->
      <div class="form-group" id="formSchedule">
        <div class="input-row">
          <span>Rest Start Time</span>
          <input type="time" id="inpStart">
        </div>
        <div class="input-row">
          <span>Rest End Time</span>
          <input type="time" id="inpEnd">
        </div>
        <button class="action-btn" onclick="saveSchedule()">Save Schedule</button>
      </div>

      <!-- Custom Music Links -->
      <div class="form-group" id="formMusic">
        <div class="input-col">
          <span>Apple Music (分享連結)</span>
          <input type="text" id="inpApple" placeholder="https://music.apple.com/...">
        </div>
        <div class="input-col">
          <span>Spotify (分享連結)</span>
          <input type="text" id="inpSpotify" placeholder="https://open.spotify.com/playlist/...">
        </div>
        <div class="input-col">
          <span>YouTube (影片連結)</span>
          <input type="text" id="inpYoutube" placeholder="https://www.youtube.com/watch?v=...">
        </div>
        <div class="hint-text">貼上你自己的播放清單或影片網址，系統會自動轉換為嵌入播放器。</div>
        <button class="action-btn" onclick="saveMusicLinks()">Update Music</button>
      </div>

    </div>
  </div>

  <script>
    // Config with Default Lofi / Deep Focus fallbacks
    let config = {
      mode: 'interval',
      focusMins: 50,
      restMins: 10,
      cycleStartTime: null, 
      scheduleStart: '12:00',
      scheduleEnd: '13:00',
      urlApple: 'https://music.apple.com/us/playlist/lo-fi-hip-hop/pl.b7952a20b22a466ba727f27fbbf01479',
      urlSpotify: 'https://open.spotify.com/playlist/37i9dQZF1DWWQRwui0ExPn',
      urlYoutube: 'https://www.youtube.com/watch?v=jfKfPfyJRdk'
    };

    try {
      const saved = localStorage.getItem('zen_clock_config');
      if (saved) config = { ...config, ...JSON.parse(saved) };
    } catch (e) {}

    // Init UI
    document.getElementById('inpFocus').value = config.focusMins;
    document.getElementById('inpRest').value = config.restMins;
    document.getElementById('inpStart').value = config.scheduleStart;
    document.getElementById('inpEnd').value = config.scheduleEnd;
    document.getElementById('inpApple').value = config.urlApple;
    document.getElementById('inpSpotify').value = config.urlSpotify;
    document.getElementById('inpYoutube').value = config.urlYoutube;

    function persistConfig() { localStorage.setItem('zen_clock_config', JSON.stringify(config)); }

    // Smart URL Converter for Embeds
    function getEmbedUrl(url, platform) {
      if (!url) return '';
      try {
        if (platform === 'apple' && url.includes('music.apple.com') && !url.includes('embed.music')) {
          return url.replace('music.apple.com', 'embed.music.apple.com');
        }
        if (platform === 'spotify' && url.includes('open.spotify.com') && !url.includes('/embed/')) {
          return url.replace('open.spotify.com/', 'open.spotify.com/embed/');
        }
        if (platform === 'youtube') {
          let vid = '';
          if (url.includes('youtu.be/')) vid = url.split('youtu.be/')[1].split('?')[0];
          else if (url.includes('youtube.com/watch')) vid = new URLSearchParams(url.split('?')[1]).get('v');
          if (vid) return `https://www.youtube.com/embed/${vid}`;
        }
      } catch (e) {}
      return url; // fallback
    }

    function applyMusicFrames() {
      document.getElementById('frame-apple').src = getEmbedUrl(config.urlApple, 'apple');
      document.getElementById('frame-spotify').src = getEmbedUrl(config.urlSpotify, 'spotify');
      document.getElementById('frame-youtube').src = getEmbedUrl(config.urlYoutube, 'youtube');
    }
    applyMusicFrames(); // Apply on load

    // Setup Overlay
    const overlay = document.getElementById('settingsOverlay');
    document.getElementById('btnOpenSettings').onclick = () => overlay.classList.add('active');
    document.getElementById('btnCloseSettings').onclick = () => overlay.classList.remove('active');
    overlay.onclick = (e) => { if(e.target === overlay) overlay.classList.remove('active'); };

    // Drawer Click Handler
    const musicDrawer = document.getElementById('musicDrawer');
    musicDrawer.addEventListener('click', (e) => {
      if (e.target === musicDrawer || e.target.classList.contains('music-indicator')) {
        musicDrawer.classList.toggle('active');
      }
    });

    // Music Switcher
    function switchMusic(element) {
      document.querySelectorAll('.m-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.music-frame').forEach(f => f.classList.remove('active'));
      element.classList.add('active');
      document.getElementById(element.getAttribute('data-target')).classList.add('active');
    }

    // Settings Logic
    function switchTab(tabId) {
      if (tabId !== 'music') config.mode = tabId;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-group').forEach(f => f.classList.remove('active'));
      
      const tabPrefix = tabId.charAt(0).toUpperCase() + tabId.slice(1);
      document.getElementById('tab' + tabPrefix).classList.add('active');
      document.getElementById('form' + tabPrefix).classList.add('active');
      
      if(tabId !== 'music') { persistConfig(); checkRestStatus(); }
    }

    function startInterval() {
      config.focusMins = parseInt(document.getElementById('inpFocus').value) || 50;
      config.restMins = parseInt(document.getElementById('inpRest').value) || 10;
      config.cycleStartTime = Date.now();
      persistConfig(); overlay.classList.remove('active'); checkRestStatus();
    }

    function saveSchedule() {
      config.scheduleStart = document.getElementById('inpStart').value;
      config.scheduleEnd = document.getElementById('inpEnd').value;
      persistConfig(); overlay.classList.remove('active'); checkRestStatus();
    }

    function saveMusicLinks() {
      config.urlApple = document.getElementById('inpApple').value;
      config.urlSpotify = document.getElementById('inpSpotify').value;
      config.urlYoutube = document.getElementById('inpYoutube').value;
      persistConfig();
      applyMusicFrames();
      overlay.classList.remove('active');
    }

    // Status Engine
    function checkRestStatus() {
      const now = new Date();
      let isResting = false;

      if (config.mode === 'interval') {
        if (config.cycleStartTime) {
          const elapsedMs = now.getTime() - config.cycleStartTime;
          const focusMs = config.focusMins * 60000;
          const totalCycleMs = (config.focusMins + config.restMins) * 60000;
          isResting = (elapsedMs % totalCycleMs) >= focusMs;
        }
      } else if (config.mode === 'schedule') {
        const currentMins = now.getHours() * 60 + now.getMinutes();
        const [sh, sm] = config.scheduleStart.split(':').map(Number);
        const [eh, em] = config.scheduleEnd.split(':').map(Number);
        const startMins = sh * 60 + sm; const endMins = eh * 60 + em;

        if (startMins < endMins) isResting = currentMins >= startMins && currentMins < endMins;
        else isResting = currentMins >= startMins || currentMins < endMins;
      }

      const container = document.getElementById('mainContainer');
      const badge = document.getElementById('statusBadge');
      const text = document.getElementById('statusText');

      if (isResting) {
        container.classList.add('is-resting');
        badge.classList.add('resting');
        text.textContent = "REST PROTOCOL";
      } else {
        container.classList.remove('is-resting');
        badge.classList.remove('resting');
        text.textContent = "FOCUS PROTOCOL";
      }
    }

    // Clock Core
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
      checkRestStatus();
    }
    setInterval(updateTime, 1000); updateTime();

    // Fullscreen
    document.body.addEventListener('dblclick', (e) => {
      if(e.target.closest('.settings-overlay') || e.target.closest('.settings-trigger') || e.target.closest('.music-drawer')) return;
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else if (document.exitFullscreen) document.exitFullscreen();
    });
  </script>
</body>
</html>
