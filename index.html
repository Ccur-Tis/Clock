<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>O-P Labs | Zen Protocol Clock</title>
  <style>
    :root {
      --bg: #030406;
      --text: #ffffff;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.4);
      --panel-bg: rgba(12, 14, 18, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
      --muted: #737a85;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      transition: background-color 0.8s ease;
    }

    /* Main Clock Display */
    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.6;
      transition: color 0.5s ease, opacity 0.5s ease;
    }
    .pulse-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 0 8px var(--text);
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }
    .status-badge.resting { color: var(--emerald); opacity: 1; }
    .status-badge.resting .pulse-dot {
      background: var(--emerald);
      box-shadow: 0 0 12px var(--emerald);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    #clock {
      font-size: 16vw;
      font-weight: 800;
      letter-spacing: -3px;
      font-variant-numeric: tabular-nums;
      transition: color 0.8s ease, text-shadow 0.8s ease, transform 0.3s ease;
    }

    .is-resting #clock {
      color: var(--emerald);
      text-shadow: 0 0 40px var(--emerald-glow);
    }

    /* Settings Trigger */
    .settings-trigger {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      opacity: 0;
      cursor: pointer;
      z-index: 50;
      transition: opacity 0.3s ease;
      color: var(--muted);
    }
    body:hover .settings-trigger, .settings-trigger:active { opacity: 0.5; }
    .settings-trigger:hover { opacity: 1; }

    /* Settings Panel */
    .settings-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .settings-overlay.active { opacity: 1; pointer-events: auto; }
    .settings-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 24px;
      border-radius: 20px;
      width: 85%;
      max-width: 340px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      transform: translateY(20px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .settings-overlay.active .settings-panel { transform: translateY(0); }
    
    .panel-header {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }
    .close-btn { font-size: 20px; cursor: pointer; color: var(--muted); }
    
    .tabs {
      display: flex;
      background: rgba(0,0,0,0.4);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
      padding: 8px 0;
      cursor: pointer;
      border-radius: 7px;
      color: var(--muted);
      transition: 0.2s;
    }
    .tab.active { background: #1a1e24; color: var(--text); }

    .form-group { display: none; flex-direction: column; gap: 16px; }
    .form-group.active { display: flex; }
    
    .input-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #a1a1aa; }
    
    input[type="number"], input[type="time"] {
      background: #090b0e;
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      width: 90px;
      font-family: inherit;
    }
    input:focus { border-color: var(--emerald); }

    .action-btn {
      margin-top: 4px;
      width: 100%;
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .action-btn.emerald { background: var(--emerald); color: #000; }

    /* ==========================================
       Pure Minimal Music Drawer
       ========================================== */
    .music-drawer {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(calc(100% - 14px));
      width: 85%;
      max-width: 360px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      padding: 10px 16px 20px;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
    }
    .music-drawer:hover, .music-drawer.active {
      transform: translateX(-50%) translateY(0);
    }
    .music-indicator {
      width: 36px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .music-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .music-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: #d1d5db;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s, border-color 0.2s;
    }
    .music-btn:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
    .music-btn:active { transform: scale(0.97); }

    .music-btn.apple:hover { border-color: rgba(250, 36, 60, 0.5); }
    .music-btn.spotify:hover { border-color: rgba(29, 185, 84, 0.5); }
    .music-btn.youtube:hover { border-color: rgba(255, 0, 51, 0.5); }

    @media (max-width: 600px) {
      #clock { font-size: 22vw; }
      .settings-trigger { opacity: 0.35; }
      .music-drawer { width: 90%; }
    }
  </style>
</head>
<body>

  <!-- Top-Left Settings Gear -->
  <div class="settings-trigger" id="btnOpenSettings">⚙️</div>

  <!-- Center Clock -->
  <div class="clock-container" id="mainContainer">
    <div class="status-badge" id="statusBadge">
      <span class="pulse-dot"></span>
      <span id="statusText">FOCUS PROTOCOL</span>
    </div>
    <div id="clock">00:00:00</div>
  </div>

  <!-- Pure Minimal Music Command Dock -->
  <div class="music-drawer" id="musicDrawer">
    <div class="music-indicator"></div>
    <div class="music-list">
      <button class="music-btn apple" onclick="openMiniWindow('https://music.apple.com', 'AppleMusic')">
        Apple Music
      </button>
      <button class="music-btn spotify" onclick="openMiniWindow('https://open.spotify.com', 'Spotify')">
        Spotify
      </button>
      <button class="music-btn youtube" onclick="openMiniWindow('https://music.youtube.com', 'YouTubeMusic')">
        YouTube Music
      </button>
    </div>
  </div>

  <!-- Rest Protocol Settings Overlay -->
  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
      <div class="panel-header">
        <span>Rest Protocol Settings</span>
        <span class="close-btn" id="btnCloseSettings">&times;</span>
      </div>
      
      <div class="tabs">
        <div class="tab active" id="tabInterval" onclick="switchTab('interval')">Interval</div>
        <div class="tab" id="tabSchedule" onclick="switchTab('schedule')">Schedule</div>
      </div>

      <div class="form-group active" id="formInterval">
        <div class="input-row">
          <span>Focus Time (mins)</span>
          <input type="number" id="inpFocus" min="1">
        </div>
        <div class="input-row">
          <span>Rest Time (mins)</span>
          <input type="number" id="inpRest" min="1">
        </div>
        <button class="action-btn emerald" onclick="startInterval()">Start Protocol</button>
      </div>

      <div class="form-group" id="formSchedule">
        <div class="input-row">
          <span>Rest Start Time</span>
          <input type="time" id="inpStart">
        </div>
        <div class="input-row">
          <span>Rest End Time</span>
          <input type="time" id="inpEnd">
        </div>
        <button class="action-btn" onclick="saveSchedule()">Save Schedule</button>
      </div>
    </div>
  </div>

  <script>
    let config = {
      mode: 'interval',
      focusMins: 50,
      restMins: 10,
      cycleStartTime: null, 
      scheduleStart: '12:00',
      scheduleEnd: '13:00'
    };

    try {
      const saved = localStorage.getItem('zen_clock_config_v3');
      if (saved) config = { ...config, ...JSON.parse(saved) };
    } catch (e) {}

    document.getElementById('inpFocus').value = config.focusMins;
    document.getElementById('inpRest').value = config.restMins;
    document.getElementById('inpStart').value = config.scheduleStart;
    document.getElementById('inpEnd').value = config.scheduleEnd;
    switchTab(config.mode);

    function persistConfig() {
      localStorage.setItem('zen_clock_config_v3', JSON.stringify(config));
    }

    // Clean Pop-out Mini Window
    function openMiniWindow(url, title) {
      const w = 400;
      const h = 600;
      const left = window.screen.width - w - 40;
      const top = window.screen.height - h - 80;
      window.open(
        url,
        title,
        `width=${w},height=${h},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes`
      );
      // 自動收起底艙
      document.getElementById('musicDrawer').classList.remove('active');
    }

    // Drawer Pinning Logic
    const musicDrawer = document.getElementById('musicDrawer');
    musicDrawer.addEventListener('click', (e) => {
      if (e.target === musicDrawer || e.target.classList.contains('music-indicator')) {
        musicDrawer.classList.toggle('active');
      }
    });

    // Settings Modal
    const overlay = document.getElementById('settingsOverlay');
    document.getElementById('btnOpenSettings').onclick = () => overlay.classList.add('active');
    document.getElementById('btnCloseSettings').onclick = () => overlay.classList.remove('active');
    overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('active'); };

    function switchTab(mode) {
      config.mode = mode;
      document.getElementById('tabInterval').classList.toggle('active', mode === 'interval');
      document.getElementById('tabSchedule').classList.toggle('active', mode === 'schedule');
      document.getElementById('formInterval').classList.toggle('active', mode === 'interval');
      document.getElementById('formSchedule').classList.toggle('active', mode === 'schedule');
      persistConfig();
      checkRestStatus();
    }

    function startInterval() {
      config.focusMins = parseInt(document.getElementById('inpFocus').value) || 50;
      config.restMins = parseInt(document.getElementById('inpRest').value) || 10;
      config.cycleStartTime = Date.now();
      persistConfig();
      overlay.classList.remove('active');
      checkRestStatus();
    }

    function saveSchedule() {
      config.scheduleStart = document.getElementById('inpStart').value;
      config.scheduleEnd = document.getElementById('inpEnd').value;
      persistConfig();
      overlay.classList.remove('active');
      checkRestStatus();
    }

    function checkRestStatus() {
      const now = new Date();
      let isResting = false;

      if (config.mode === 'interval') {
        if (config.cycleStartTime) {
          const elapsedMs = now.getTime() - config.cycleStartTime;
          const focusMs = config.focusMins * 60000;
          const totalCycleMs = (config.focusMins + config.restMins) * 60000;
          isResting = (elapsedMs % totalCycleMs) >= focusMs;
        }
      } else if (config.mode === 'schedule') {
        const currentMins = now.getHours() * 60 + now.getMinutes();
        const [sh, sm] = config.scheduleStart.split(':').map(Number);
        const [eh, em] = config.scheduleEnd.split(':').map(Number);
        const startMins = sh * 60 + sm, endMins = eh * 60 + em;
        isResting = startMins < endMins
          ? (currentMins >= startMins && currentMins < endMins)
          : (currentMins >= startMins || currentMins < endMins);
      }

      const container = document.getElementById('mainContainer');
      const badge = document.getElementById('statusBadge');
      const text = document.getElementById('statusText');

      if (isResting) {
        container.classList.add('is-resting');
        badge.classList.add('resting');
        text.textContent = "REST PROTOCOL";
      } else {
        container.classList.remove('is-resting');
        badge.classList.remove('resting');
        text.textContent = "FOCUS PROTOCOL";
      }
    }

    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
      checkRestStatus();
    }
    setInterval(updateTime, 1000);
    updateTime();

    document.body.addEventListener('dblclick', (e) => {
      if (e.target.closest('.settings-overlay') || e.target.closest('.settings-trigger') || e.target.closest('.music-drawer')) return;
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else if (document.exitFullscreen) document.exitFullscreen();
    });
  </script>
</body>
</html>
